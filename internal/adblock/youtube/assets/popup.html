<body><h1>YouTube Companion</h1><label><input id="enabled" type="checkbox"> Фильтрация включена</label><p id="status" role="status"></p><p>После изменения обновите страницу YouTube. Расширение очищает рекламные поля ответа плеера и пропускает видео, явно отмеченные как реклама.</p><p>Не работает в официальном приложении YouTube. YouTube может менять плеер: удаление всех видов рекламы не гарантируется.</p><script src="popup.js"></script></body></html>
