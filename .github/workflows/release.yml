name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - "internal/Telemt/telemt.service"
      - "internal/Telemt/telemt-update.service"
      - "internal/Telemt/telemt-update.timer"
      - "internal/Telemt/telemt-update.sh"
      - "internal/Telemt/telemt.toml.example"
      - "internal/Telemt/telemt-meko-fix.service"
      - "internal/Telemt/telemt-meko-fix.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/build.yml"
      - "internal/config/version"

jobs:
  frontend:
    name: Build frontend once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: make test-go

      - name: Build frontend bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: internal/web/dist
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [frontend]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Restore Go compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ matrix.platform }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.platform }}-

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: internal/web/dist

      - name: Build Linux package
        shell: bash
        run: |
          set -euo pipefail
          CURL_RETRY=(--retry 5 --retry-all-errors --retry-delay 3)
          fetch() {
            local output=""
            local url=""
            case "${1:-}" in
              -O)
                output="$2"
                shift 2
                url="$1"
                ;;
              -o)
                output="$2"
                shift 2
                url="$1"
                ;;
              *)
                url="$1"
                output="${url%%\?*}"
                output="${output##*/}"
                ;;
            esac
            test -n "$url"
            test -n "$output"
            curl -fL --show-error --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$output" "$url"
          }

          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH=x86-64 ;;
            arm64) BOOTLIN_ARCH=aarch64 ;;
            *) exit 1 ;;
          esac

          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_URL=$(curl -fsSL "${CURL_RETRY[@]}" "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)
          test -n "$TARBALL_URL"
          cd /tmp
          curl -fL -sS "${CURL_RETRY[@]}" -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          test -n "$TOOLCHAIN_DIR"
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          test -n "$CC"
          cd -

          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/SawaMEN/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/SawaMEN/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -p 12 -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .

          # Stable and rolling dev releases share the same source commit but
          # must advertise different versions. Build a second binary without
          # the injected dev commit for the stable release on main.
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            go build -p 12 -buildvcs=true -ldflags "-w -s -linkmode external -extldflags '-static'" -o xui-stable -v .
          fi

          rm -rf x-ui
          mkdir -p x-ui/bin
          mv xui-release x-ui/x-ui
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp internal/Telemt/telemt.service x-ui/
          cp internal/Telemt/telemt-update.service x-ui/
          cp internal/Telemt/telemt-update.timer x-ui/
          install -m 0755 internal/Telemt/telemt-update.sh x-ui/telemt-update.sh
          cp internal/Telemt/telemt.toml.example x-ui/
          cp internal/Telemt/telemt-meko-fix.sh x-ui/
          cp internal/Telemt/telemt-meko-fix.service x-ui/
          cp x-ui.sh x-ui/
          cp x-ui-core.sh x-ui/
          cd x-ui/bin

          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.9.9/"
          if [[ "${{ matrix.platform }}" == amd64 ]]; then
            fetch "${Xray_URL}Xray-linux-64.zip"
            unzip -q Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          else
            fetch "${Xray_URL}Xray-linux-arm64-v8a.zip"
            unzip -q Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          fi

          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            amd64) TELEMT_ARCH=x86_64 ; TUIC_ARCH=x86_64-unknown-linux-musl ;;
            arm64) TELEMT_ARCH=aarch64 ; TUIC_ARCH=aarch64-unknown-linux-musl ;;
          esac
          TELEMT_VER=$(gh api repos/telemt/telemt/releases/latest --jq '.tag_name')
          test -n "$TELEMT_VER"
          TELEMT_PKG="telemt-${TELEMT_ARCH}-linux-musl.tar.gz"
          curl -sfLRO "${CURL_RETRY[@]}" "https://github.com/telemt/telemt/releases/download/${TELEMT_VER}/${TELEMT_PKG}"
          tar -xzf "$TELEMT_PKG"
          chmod +x telemt
          rm -f "$TELEMT_PKG"

          curl -sfLRo tuic-server "${CURL_RETRY[@]}" "https://github.com/EAimTY/tuic/releases/download/tuic-server-1.0.0/tuic-server-1.0.0-${TUIC_ARCH}"
          chmod +x tuic-server

          PINGTUNNEL_VERSION=2.10
          curl -fL --show-error "${CURL_RETRY[@]}" -o pingtunnel.zip "https://github.com/esrrhs/pingtunnel/releases/download/${PINGTUNNEL_VERSION}/pingtunnel_linux_${{ matrix.platform }}.zip"
          unzip -p pingtunnel.zip pingtunnel > pingtunnel
          chmod 0755 pingtunnel
          rm pingtunnel.zip

          case "${{ matrix.platform }}" in amd64) TRUST_ARCH=x86_64 ;; arm64) TRUST_ARCH=aarch64 ;; esac
          TRUST_VERSION=1.1.0
          curl -fL --show-error "${CURL_RETRY[@]}" -o trusttunnel.tar.gz "https://github.com/TrustTunnel/TrustTunnel/releases/download/v${TRUST_VERSION}/trusttunnel-v${TRUST_VERSION}-linux-${TRUST_ARCH}.tar.gz"
          tar -xOzf trusttunnel.tar.gz "trusttunnel-v${TRUST_VERSION}-linux-${TRUST_ARCH}/trusttunnel_endpoint" > trusttunnel_endpoint
          chmod 0755 trusttunnel_endpoint
          rm trusttunnel.tar.gz

          MIERU_VER=$(gh api repos/enfein/mieru/releases/latest --jq '.tag_name')
          test -n "$MIERU_VER"
          case "${{ matrix.platform }}" in amd64) MIERU_ARCH=linux_amd64 ;; arm64) MIERU_ARCH=linux_arm64 ;; esac
          MIERU_PKG="mita_${MIERU_VER#v}_linux_${{ matrix.platform }}.tar.gz"
          curl -fL --show-error --retry 8 --retry-all-errors --retry-delay 5 -o "$MIERU_PKG" "https://github.com/enfein/mieru/releases/download/${MIERU_VER}/${MIERU_PKG}"
          tar -xzf "$MIERU_PKG"
          MITA_BIN=$(find . -type f -name mita -perm -111 | head -n1)
          test -n "$MITA_BIN"
          echo "Mieru asset verified: $MIERU_PKG"
          chmod +x "$MITA_BIN"
          rm -f "$MIERU_PKG"

          cd ../..

      - name: Package
        run: |
          tar -zcf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            mv xui-stable x-ui/x-ui
            mkdir -p stable
            tar -zcf stable/x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
            (cd stable && sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256)
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: |
            x-ui-linux-${{ matrix.platform }}.tar.gz
            x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload stable build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: stable-x-ui-linux-${{ matrix.platform }}
          path: |
            stable/x-ui-linux-${{ matrix.platform }}.tar.gz
            stable/x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload stable release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: false

  publish-versioned-release:
    name: Publish versioned stable release from main
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure stable release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          TAG="v${VERSION}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid panel version: ${VERSION}" >&2
            exit 1
          fi

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --generate-notes
          fi

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: stable-x-ui-linux-*
          path: stable-artifacts
          merge-multiple: true

      - name: Upload stable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < internal/config/version)"
          TAG="v${VERSION}"
          for asset in \
            stable-artifacts/x-ui-linux-amd64.tar.gz \
            stable-artifacts/x-ui-linux-amd64.tar.gz.sha256 \
            stable-artifacts/x-ui-linux-arm64.tar.gz \
            stable-artifacts/x-ui-linux-arm64.tar.gz.sha256; do
            test -f "${asset}"
            uploaded=false
            for attempt in {1..5}; do
              if gh release upload "${TAG}" "${asset}" --clobber; then
                uploaded=true
                break
              fi
              if (( attempt < 5 )); then
                sleep $((attempt * 3))
              fi
            done
            if [[ "${uploaded}" != true ]]; then
              echo "Failed to upload ${asset} to ${TAG} after 5 attempts" >&2
              exit 1
            fi
          done

  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: x-ui-linux-*
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${COMMIT::8}"
          git tag -f dev-latest "$COMMIT"
          git push -f origin refs/tags/dev-latest
          if ! gh release edit dev-latest --prerelease --latest=false --title "Dev build $short" --notes "Rolling development build from main. commit=$COMMIT"; then
            gh release create dev-latest --prerelease --latest=false --target "$COMMIT" --title "Dev build $short" --notes "Rolling development build from main. commit=$COMMIT"
          fi
          gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 --clobber
